name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Unpack approved portfolio
        run: |
          unzip -q portfolio-redesign.zip -d site
          test -f site/portfolio-redesign/index.html
          rm -f site/portfolio-redesign/README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/portfolio-redesign
      - name: Publish portfolio
        id: deployment
        uses: actions/deploy-pages@v4
